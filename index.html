<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Penna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAF9F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDF Penna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Libreria -->
<main id="library">
  <header class="lib-head">
    <h1>I miei quaderni</h1>
    <div id="sync-box">
      <span class="sync-chip"><i class="sync-dot"></i><span id="sync-text">Solo su questo dispositivo</span></span>
      <button id="btn-sync" class="tb" hidden>↻ Sincronizza ora</button>
      <button id="btn-onedrive" class="tb">☁ Collega OneDrive</button>
      <button id="btn-signout" class="tb" hidden>Scollega</button>
    </div>
  </header>
  <p id="sync-help" class="muted"></p>
  <input id="search" type="search" placeholder="Cerca nei titoli e nelle note…" autocomplete="off">
  <nav id="crumbs"></nav>
  <div id="lib-grid"></div>
  <p id="lib-empty" class="muted" hidden>Qui non c’è ancora niente. Crea un quaderno con il pulsante qui sotto.</p>
  <ul id="results" hidden></ul>
  <div id="lib-actions">
    <button id="btn-new-nb" class="tb accent">＋ Quaderno</button>
    <button id="btn-new-folder" class="tb">＋ Cartella</button>
    <label class="tb" for="pdf-input">⤓ Importa PDF</label>
    <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden>
  </div>
</main>

<!-- Quaderno -->
<section id="notebook" hidden>
  <header id="toolbar">
    <button id="btn-back" class="tb" title="Torna ai quaderni">‹ Quaderni</button>
    <button id="btn-pages" class="tb" title="Elenco pagine">☰ Pagine</button>
    <span class="sep"></span>
    <button id="tool-pen" class="tb tool active" data-tool="pen">✎ Penna</button>
    <button id="tool-hl" class="tb tool" data-tool="hl">▬ Evidenziatore</button>
    <button id="tool-eraser" class="tb tool" data-tool="eraser">⌫ Gomma</button>
    <button id="tool-text" class="tb tool" data-tool="text">Aa Testo</button>
    <span class="sep"></span>
    <span id="colors">
      <button class="color active" data-color="#1a1a1a" style="background:#1a1a1a" aria-label="Nero"></button>
      <button class="color" data-color="#1f5fd1" style="background:#1f5fd1" aria-label="Blu"></button>
      <button class="color" data-color="#d62828" style="background:#d62828" aria-label="Rosso"></button>
      <button class="color" data-color="#2a9d4a" style="background:#2a9d4a" aria-label="Verde"></button>
      <button class="color" data-color="#f5c400" style="background:#f5c400" aria-label="Giallo"></button>
    </span>
    <label class="size">Spessore
      <input id="size" type="range" min="1" max="10" step="1" value="3">
    </label>
    <span id="text-tools" hidden>
      <button class="tb" data-add="h">Titolo</button>
      <button class="tb" data-add="p">Testo</button>
      <button class="tb" data-add="ul">• Elenco</button>
      <button class="tb" data-add="todo">☑ Checklist</button>
    </span>
    <span class="sep"></span>
    <button id="btn-undo" class="tb" title="Annulla" disabled>↶</button>
    <button id="btn-redo" class="tb" title="Ripeti" disabled>↷</button>
    <label class="tb" for="img-input" title="Inserisci immagine">🖼 Immagine</label>
    <input id="img-input" type="file" accept="image/*" hidden>
    <span class="spacer"></span>
    <span class="sync-chip mini"><i class="sync-dot"></i></span>
    <span id="page-ind" class="muted"></span>
    <button id="btn-export" class="tb accent">⇪ Condividi PDF</button>
  </header>
  <div id="nb-body">
    <aside id="sidebar">
      <div id="side-title"></div>
      <ol id="page-list"></ol>
      <button id="btn-add-page" class="tb accent">＋ Aggiungi pagina</button>
      <input id="pdf-add-input" type="file" accept="application/pdf,.pdf" hidden>
    </aside>
    <div id="viewer"><div id="pages"></div></div>
  </div>
</section>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h3 id="dlg-title"></h3>
    <p id="dlg-text"></p>
    <input id="dlg-input" type="text" autocomplete="off">
    <div id="dlg-options"></div>
    <div class="dlg-btns"><button type="button" id="dlg-cancel" class="tb">Annulla</button></div>
  </form>
</dialog>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/msal-browser.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
